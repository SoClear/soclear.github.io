name: Deploy Rspress site to Pages

on:
  push:
    branches: [ rspress ] # 监听 rspress 分支
  workflow_dispatch: # 允许在 GitHub 网页上手动触发

# 设置 GITHUB_TOKEN 的权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发的部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 使用 Bun 官方 Action
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Rspress
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Rspress 默认的构建输出目录是 doc_build
          # 如果你在配置里修改了 outDir，请同步修改这里
          path: 'doc_build' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4